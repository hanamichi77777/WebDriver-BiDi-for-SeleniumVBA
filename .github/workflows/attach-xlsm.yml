name: Attach xlsm to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v8.1)"
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Upload xlsm
        run: gh release upload "$TAG" SeleniumVBA_BiDi.xlsm --clobber
        env:
          GH_TOKEN: ${{ github.token }}